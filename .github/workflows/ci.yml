name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real Postgres is needed for `prisma migrate deploy`; validation itself is
    # offline, but running the migration proves the schema actually applies.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syscanner
          POSTGRES_PASSWORD: syscanner
          POSTGRES_DB: syscanner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U syscanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://syscanner:syscanner@localhost:5432/syscanner?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply migrations
        run: pnpm --filter @syscanner/db run db:deploy
